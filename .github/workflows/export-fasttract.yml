name: Export Fasttract Source

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create source archive
        run: |
          rm -rf .git
          zip -r fasttract-source.zip . -x 'node_modules/*' 'dist/*'
      - name: Upload Fasttract source
        uses: actions/upload-artifact@v4
        with:
          name: fasttract-source
          path: fasttract-source.zip
          if-no-files-found: error
