name: Deploy FastTract production

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".env"
      - ".env.production"
      - ".github/workflows/deploy-vercel-production.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to build and deploy FastTract to production"
        required: false
        default: "DEPLOY"
        type: string

permissions:
  contents: read

concurrency:
  group: fasttract-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_9wZiPEF74UMyEFvgkMtDCmum
      VERCEL_PROJECT_ID: prj_89P35G2ZVL6lcTDXr3rSK4WslCZb
      VITE_SUPABASE_PROJECT_ID: qjusjfdrtposrthlcjeu
      VITE_SUPABASE_URL: https://qjusjfdrtposrthlcjeu.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_zx4gzhfijwHArY8ZqUNsUA_0C7xRkE_

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_ORG_ID" = "team_9wZiPEF74UMyEFvgkMtDCmum"
          test "$VERCEL_PROJECT_ID" = "prj_89P35G2ZVL6lcTDXr3rSK4WslCZb"
          test "$VITE_SUPABASE_PROJECT_ID" = "qjusjfdrtposrthlcjeu"

      - name: Install dependencies
        run: npm ci

      - name: Report legacy lint debt
        continue-on-error: true
        run: npm run lint

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Inspect custom-domain DNS
        continue-on-error: true
        shell: bash
        run: |
          npx vercel@latest domains inspect app.fasttract.org --token="$VERCEL_TOKEN"
          npx vercel@latest domains inspect app.fast-tract.com --token="$VERCEL_TOKEN"

      - name: Build and deploy production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          deployment_url=$(npx vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tail -n 1)
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "FastTract production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify FastTract production alias
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          status=$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' "https://fasttract-app.vercel.app/")
          test "$status" = "200"
          grep -q "FastTract | Your Personal AI Business Assistant" "$body"
          echo "Verified FastTract production alias: https://fasttract-app.vercel.app" >> "$GITHUB_STEP_SUMMARY"

      - name: Check custom-domain cutover
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          status=$(curl --silent --show-error --location --output "$body" --write-out '%{http_code}' "https://app.fasttract.org/" || true)
          if [ "$status" = "200" ] && grep -q "FastTract | Your Personal AI Business Assistant" "$body"; then
            echo "Custom domain is serving FastTract: https://app.fasttract.org" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::app.fasttract.org is not serving the FastTract Vercel build yet; DNS/provider cutover is still required."
            echo "Custom domain cutover pending: app.fasttract.org" >> "$GITHUB_STEP_SUMMARY"
          fi
