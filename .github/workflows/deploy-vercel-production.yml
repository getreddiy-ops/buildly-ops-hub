name: Deploy FastTract production

# FastTract is a Vite + React single-page app (see vercel.json:
# "framework": "vite"), not a Next.js app -- there are no /api routes and no
# server runtime to configure. If this repo is connected to a Vercel project
# through Vercel's native GitHub integration, Vercel already builds and
# deploys on every push to main with zero input from this workflow; this
# workflow exists as an explicit, auditable, confirmation-gated alternative
# for pushing a specific commit to production on demand.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to build and deploy FastTract to production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fasttract-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Frontend VITE_* values are committed in .env / .env.production (they
      # are an anon/public Supabase key and a publishable Paddle token, safe
      # to ship in the client bundle) -- Vite picks them up automatically, no
      # secret injection needed here. Override via Vercel project env vars
      # only if you need a different value than what's committed.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck and test (fail fast before touching production)
        run: |
          npm run lint
          npm test
          npm run build

      - name: Link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build and deploy production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          deployment_url=$(npx vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tail -n 1)
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "FastTract production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test deployment
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL/")
          test "$status" = "200"
