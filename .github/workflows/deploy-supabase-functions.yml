name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to push all supabase/functions/* to production and sync their secrets"
        required: false
        default: "DEPLOY"
        type: string

permissions:
  contents: read

concurrency:
  group: fasttract-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      PROJECT_ID: qjusjfdrtposrthlcjeu
      SUPABASE_ACCESS_TOKEN: ${{ secrets.TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
      GHL_CLIENT_ID: ${{ secrets.GHL_CLIENT_ID }}
      GHL_CLIENT_SECRET: ${{ secrets.GHL_CLIENT_SECRET }}
      GHL_STATE_SECRET: ${{ secrets.GHL_STATE_SECRET }}
      GHL_REDIRECT_URI: ${{ vars.GHL_REDIRECT_URI }}
      GHL_SCOPES: ${{ vars.GHL_SCOPES }}
      GHL_SUCCESS_URL: ${{ vars.GHL_SUCCESS_URL }}
      GHL_ERROR_URL: ${{ vars.GHL_ERROR_URL }}
      LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PADDLE_SANDBOX_API_KEY: ${{ secrets.PADDLE_SANDBOX_API_KEY }}
      PADDLE_LIVE_API_KEY: ${{ secrets.PADDLE_LIVE_API_KEY }}
      PAYMENTS_SANDBOX_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_SANDBOX_WEBHOOK_SECRET }}
      PAYMENTS_LIVE_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_LIVE_WEBHOOK_SECRET }}
      TWILIO_API_KEY: ${{ secrets.TWILIO_API_KEY }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_WEBHOOK_SECRET: ${{ secrets.ELEVENLABS_WEBHOOK_SECRET }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0-beta.49

      - name: Validate required credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$GHL_CLIENT_ID"
          test -n "$GHL_CLIENT_SECRET"
          test -n "$GHL_STATE_SECRET"

      - name: Link production project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Sync function secrets (skips any that are empty)
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for name in GHL_CLIENT_ID GHL_CLIENT_SECRET GHL_STATE_SECRET GHL_REDIRECT_URI GHL_SCOPES \
                      GHL_SUCCESS_URL GHL_ERROR_URL LOVABLE_API_KEY OPENAI_API_KEY \
                      PADDLE_SANDBOX_API_KEY PADDLE_LIVE_API_KEY PAYMENTS_SANDBOX_WEBHOOK_SECRET \
                      PAYMENTS_LIVE_WEBHOOK_SECRET TWILIO_API_KEY TWILIO_AUTH_TOKEN \
                      ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID ELEVENLABS_WEBHOOK_SECRET PUBLIC_APP_URL; do
            value="${!name:-}"
            if [ -n "$value" ]; then args+=("$name=$value"); fi
          done
          if [ "${#args[@]}" -gt 0 ]; then
            supabase secrets set --project-ref "$PROJECT_ID" "${args[@]}"
          fi

      - name: Deploy every function
        run: supabase functions deploy --project-ref "$PROJECT_ID"

      - name: Confirm unsigned HighLevel webhooks are rejected
        shell: bash
        run: |
          set -euo pipefail
          webhook_url="https://${PROJECT_ID}.supabase.co/functions/v1/highlevel-webhook"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' "$webhook_url")
          test "$status" = "401"
