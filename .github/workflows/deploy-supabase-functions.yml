name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY to push all supabase/functions/* to production and sync their secrets"
        required: false
        default: "DEPLOY"
        type: string

permissions:
  contents: read

concurrency:
  group: fasttract-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      PROJECT_ID: qjusjfdrtposrthlcjeu
      SUPABASE_ACCESS_TOKEN: ${{ secrets.TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0-beta.49

      - name: Validate required credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Link production project
        run: supabase link --project-ref "$PROJECT_ID"

      - name: Deploy changed functions only
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="${GITHUB_SHA}^"; fi
          mapfile -t functions < <(git diff --name-only "$base" "$GITHUB_SHA" -- supabase/functions \
            | awk -F/ '$1 == "supabase" && $2 == "functions" && $3 != "_shared" { print $3 }' \
            | sort -u)
          if ((${#functions[@]} == 0)); then
            echo "No function entrypoints changed; skipping function deployment."
            exit 0
          fi
          for function in "${functions[@]}"; do
            echo "Deploying changed function: $function"
            supabase functions deploy "$function" --project-ref "$PROJECT_ID"
          done

      - name: Deploy all functions (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'DEPLOY' }}
        run: supabase functions deploy --project-ref "$PROJECT_ID"
