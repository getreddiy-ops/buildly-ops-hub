name: Inspect Ava approval center patch

on:
  push:
    branches:
      - chatgpt/fasttract-ghl-flawless
    paths:
      - .ava-patch-v2/READY

permissions:
  contents: read

concurrency:
  group: inspect-ava-approval-center
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fasttract-ghl-flawless

      - name: Recover reviewed archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          chunks = sorted(Path('.ava-patch-v2').glob('chunk-*'))
          pieces = [''.join(path.read_text(encoding='utf-8').split()) for path in chunks]
          encoded = ''.join(pieces)
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'

          def valid(value):
              try:
                  padded = value + '=' * (-len(value) % 4)
                  archive = base64.b64decode(padded, validate=True)
                  gzip.decompress(archive)
                  return archive
              except Exception:
                  return None

          archive = valid(encoded)
          if archive is None:
              for position in range(0, len(encoded) + 1):
                  for character in alphabet:
                      archive = valid(encoded[:position] + character + encoded[position:])
                      if archive is not None:
                          print(f'Recovered at {position}')
                          break
                  if archive is not None:
                      break
          if archive is None:
              raise SystemExit('Could not recover archive')
          Path('/tmp/ava-approval-patch.tar.gz').write_bytes(archive)
          PY
          tar -xzf /tmp/ava-approval-patch.tar.gz -C .

      - name: Print approval model and focused tests
        shell: bash
        run: |
          echo '===== MODEL ====='
          sed -n '1,320p' src/pages/highlevel/avaApprovalModel.ts
          echo '===== TEST ====='
          sed -n '1,240p' src/pages/highlevel/avaApprovalModel.test.ts
