name: Finalize Ava approval integration

on:
  push:
    branches:
      - chatgpt/fasttract-ghl-flawless
    paths:
      - .ava-cleanup/READY

permissions:
  contents: write

concurrency:
  group: finalize-ava-approval-integration
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fasttract-ghl-flawless
          fetch-depth: 0

      - name: Remove final type escape and expose live test command
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          client = Path('src/integrations/highlevel/client.ts')
          source = client.read_text(encoding='utf-8')
          old = 'export type FastTractHighLevelObject = "jobs" | "time_entries" | "materials" | "change_orders";'
          new = 'export type FastTractHighLevelObject = "jobs" | "time_entries" | "materials" | "change_orders" | "ava_actions";'
          if old not in source:
              raise SystemExit('Could not locate the HighLevel object union')
          client.write_text(source.replace(old, new, 1), encoding='utf-8')

          center = Path('src/pages/highlevel/AvaApprovalCenter.tsx')
          source = center.read_text(encoding='utf-8')
          old_import = '''import {
            highLevel,
            type FastTractHighLevelObject,
          } from "@/integrations/highlevel/client";'''
          new_import = 'import { highLevel } from "@/integrations/highlevel/client";'
          old_const = 'const AVA_ACTION_OBJECT = "ava_actions" as unknown as FastTractHighLevelObject;'
          new_const = 'const AVA_ACTION_OBJECT = "ava_actions" as const;'
          if old_import not in source or old_const not in source:
              raise SystemExit('Could not locate the Ava approval type escape')
          source = source.replace(old_import, new_import, 1).replace(old_const, new_const, 1)
          center.write_text(source, encoding='utf-8')

          package = Path('package.json')
          source = package.read_text(encoding='utf-8')
          anchor = '    "test:highlevel:isolation": "node scripts/test-highlevel-isolation.mjs",\n'
          addition = anchor + '    "test:highlevel:ava-approvals": "node scripts/test-highlevel-ava-approval-isolation.mjs",\n'
          if '"test:highlevel:ava-approvals"' not in source:
              if anchor not in source:
                  raise SystemExit('Could not locate the HighLevel isolation script')
              source = source.replace(anchor, addition, 1)
          package.write_text(source, encoding='utf-8')
          PY
          rm -rf .ava-cleanup

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit critical production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Typecheck HighLevel workspace
        run: npm run typecheck:highlevel

      - name: Lint HighLevel workspace
        run: npm run lint:highlevel

      - name: Run complete test suite
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Validate both live isolation harnesses
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/test-highlevel-isolation.mjs
          node --check scripts/test-highlevel-ava-approval-isolation.mjs

      - name: Commit tested integration cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout HEAD -- .github/workflows
          git add -A
          git commit -m "Finalize typed Ava approval integration"
          git push origin HEAD:chatgpt/fasttract-ghl-flawless
